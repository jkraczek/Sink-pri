name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm types:check

      # Tests authenticate against the in-process miniflare worker with this
      # token; it never reaches a real deployment, so a fixed CI-only value is fine.
      - name: Write test env
        run: echo "NUXT_SITE_TOKEN=ci-test-token" > .env

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test --run
